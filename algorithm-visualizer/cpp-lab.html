<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>C++ BFS 实时可视化实验室</title>
  <link rel="stylesheet" href="cpp-lab.css">
</head>
<body>
  <header>
    <a href="index.html" class="back">← 算法大厅</a>
    <div class="brand"><span>C++</span> 实时算法实验室</div>
    <nav style="display:flex;gap:8px"><a href="cpp-lab.html" class="back" style="color:#ff6b45">BFS 专项</a><a href="nqueens-lab.html" class="back">N 皇后回溯</a></nav>
    <div class="status"><i id="statusDot"></i><span id="statusText">等待代码</span></div>
  </header>

  <main>
    <section class="problem-bar">
      <div><span class="tag">BFS 专项 · 已锁定算法类型</span><h1>寻找从起点到终点的最短路径</h1><p>变量名和函数名可以自由定义；页面根据队列、邻接遍历等代码结构识别 BFS。</p></div>
      <details><summary>查看输入说明</summary><div>第一行：节点数 n、边数 m、起点 s、终点 t。接下来 m 行：每条无向边的两个端点。</div></details>
    </section>

    <section class="split">
      <div class="editor-pane">
        <div class="pane-title"><span>main.cpp</span><span>标准：C++17</span></div>
        <div class="editor-wrap"><div id="lineNumbers">1</div><textarea id="code" spellcheck="false" placeholder="// 从空白开始写你的 BFS 代码…" aria-label="C++ 代码编辑器"></textarea></div>
        <div class="analysis">
          <div class="analysis-head"><span>实时代码识别</span><strong id="score">0 / 7</strong></div>
          <div id="checks" class="checks"></div>
        </div>
      </div>

      <div class="visual-pane">
        <div class="pane-title"><span>执行可视化</span><span id="phase">尚未建立图</span></div>
        <div class="graph-wrap"><svg id="edges"></svg><div id="nodes"></div><div id="emptyHint">开始定义图结构后，这里会出现节点</div></div>
        <div class="state-row">
          <div><label>队列 queue</label><div id="queue" class="chips"><em>空</em></div></div>
          <div><label>已访问 visited</label><div id="visited" class="chips"><em>空</em></div></div>
          <div><label>访问顺序</label><div id="order" class="chips"><em>空</em></div></div>
        </div>
        <div class="controls">
          <button id="reset">↺ 重置</button><button id="step">→ 单步</button><button id="run" class="primary" disabled>▶ 运行 BFS</button>
          <label>速度 <input id="speed" type="range" min="1" max="10" value="6"></label>
        </div>
        <div id="message" class="message">代码会在你输入时被实时分析。</div>
      </div>
    </section>

    <section class="input-panel">
      <div><h2>测试图输入</h2><p>修改后右侧图会自动更新。</p></div>
      <textarea id="graphInput">7 8 1 7
1 2
1 3
2 4
2 5
3 5
3 6
4 7
6 7</textarea>
      <button id="applyGraph">应用测试图</button>
    </section>
  </main>
  <script src="cpp-lab.js"></script>
</body>
</html>
