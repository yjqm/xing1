<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C++ 真实运行时可视化</title><link rel="icon" type="image/svg+xml" href="../assets/zyut-mark.svg?v=20261008-4"><link rel="stylesheet" href="cpp-lab.css?v=2"><style>
.runtime-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.runtime-editor{height:510px;min-width:0}.runtime-editor #lineNumbers{pointer-events:none}.runtime-editor textarea{display:block;width:100%;height:100%;min-width:0;min-height:0;position:relative;z-index:1;pointer-events:auto;user-select:text}.input-box{width:100%;height:80px;background:#090e16;border:1px solid #253145;color:#e9f0fb;border-radius:7px;padding:9px;font:12px Consolas;resize:vertical}.mode-select{background:#151e2b;color:#fff;border:1px solid #253145;border-radius:7px;padding:8px}.trace-area{height:455px;overflow:auto;padding:18px;position:relative}.trace-area #emptyHint{pointer-events:none}.live-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;color:#8796ad;font-size:11px}.live-badge{color:#2fd49e;background:rgba(47,212,158,.1);border:1px solid rgba(47,212,158,.35);padding:4px 8px;border-radius:999px}.live-flow{display:flex;flex-direction:column;gap:8px}.live-node{position:relative;border:1px solid #30425d;background:#142033;border-radius:8px;padding:10px 12px 10px 42px;color:#d9e8fb;font:12px/1.45 Consolas}.live-node:before{content:attr(data-kind);position:absolute;left:9px;top:9px;width:23px;height:23px;display:grid;place-items:center;border-radius:6px;background:#1d304c;color:#9cc6ff;font:10px Consolas}.live-node:not(:last-child):after{content:'';position:absolute;left:20px;top:100%;width:1px;height:9px;background:#40536e}.live-node.function{border-color:#4f9cff}.live-node.recursion{border-color:#ff6b45;background:#32201e}.live-node.branch{border-color:#f7bd4a}.live-node.state{border-color:#2fd49e}.live-node.queue{border-color:#b878ff}.live-node small{display:block;margin-top:3px;color:#71829b}.live-summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.live-summary span{padding:5px 8px;border-radius:6px;background:#0d1521;color:#8796ad;font-size:11px}.live-empty{height:100%;display:grid;place-items:center;text-align:center;color:#8796ad;line-height:1.8}.tree-node{margin:5px 0;padding:9px 12px;border:1px solid #30425d;background:#142033;border-radius:8px;color:#a9c9f4;font:12px Consolas;position:relative}.tree-node.active{border-color:#ff6b45;background:#3b241f;color:#fff}.tree-node .depth{color:#71829b;margin-right:8px}.queue-event{padding:10px;border-bottom:1px solid #253145}.queue-event b{color:#ffb548}.queue-items{display:flex;gap:5px;margin-top:7px}.queue-items span{background:#1d304c;padding:5px 8px;border-radius:5px;color:#9cc6ff}.output{height:110px;overflow:auto;background:#090e16;padding:10px;color:#b8c7dc;font:12px/1.5 Consolas;white-space:pre-wrap}.compile-error{color:#f58b98}.runtime-controls{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #253145}.runtime-controls button{border:1px solid #253145;background:#151e2b;color:#fff;padding:8px 12px;border-radius:7px;cursor:pointer}.runtime-controls .primary{background:linear-gradient(135deg,#ff6b45,#e94b61);border:0}.runtime-controls input{accent-color:#ff6b45}@media(max-width:900px){.runtime-grid{grid-template-columns:1fr}}
</style></head><body>
<header><a href="index.html" class="back">← 算法大厅</a><div class="brand"><span>C++</span> 真实运行时可视化</div><select id="mode" class="mode-select"><option value="dfs">DFS / 递归搜索</option><option value="bfs">BFS / 队列搜索</option><option value="sort">排序 / 数组交换</option><option value="search">查找 / 比较探针</option><option value="tree">树 / 递归遍历</option><option value="backtrack">回溯 / 选择与撤销</option><option value="dp">动态规划 / 状态表</option></select><div class="status ready"><i id="statusDot"></i><span id="statusText">编译器就绪</span></div></header>
<main><section class="problem-bar"><div><span class="tag">真实编译 · 名称无关</span><h1 id="title">DFS / 递归搜索运行轨迹</h1><p id="desc">函数和变量可以自由命名。运行后根据真实的递归进入、参数及返回过程生成调用树。</p></div></section>
<section class="runtime-grid"><div class="editor-pane"><div class="pane-title"><span>main.cpp</span><span>MSVC · C++17</span></div><div class="editor-wrap runtime-editor"><div id="lineNumbers">1</div><textarea id="code" spellcheck="false" placeholder="// 从空白开始编写 C++…"></textarea></div><div style="padding:10px"><label style="font-size:11px;color:#8796ad">标准输入 stdin</label><textarea id="stdin" class="input-box" placeholder="例如：8"></textarea></div><div class="runtime-controls"><button id="loadTemplate">载入本专区模板</button><button id="compile" class="primary">▶ 编译并运行</button><button id="reset">清空轨迹</button><label style="margin-left:auto;color:#8796ad;font-size:11px">回放速度 <input id="speed" type="range" min="1" max="10" value="7"></label></div></div>
<div class="visual-pane"><div class="pane-title"><span id="traceTitle">递归调用轨迹</span><span id="eventCount" class="live-badge">实时解析</span></div><div id="trace" class="trace-area"><div class="live-empty">从左侧开始写代码<br>函数、分支和递归会立即出现在这里</div></div><div class="controls"><button id="prev">← 上一步</button><button id="play" class="primary">▶ 回放</button><button id="next">下一步 →</button></div><div class="pane-title"><span>程序输出</span><span id="exitCode"></span></div><div id="output" class="output">写代码时实时预览结构；编译运行后显示真实数值轨迹。</div></div></section></main><script src="runtime-lab.js?v=4"></script></body></html>
